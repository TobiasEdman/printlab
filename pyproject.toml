[project]
name = "printlab"
version = "0.1.0"
description = "Parametric print designs, a model library and a pinned Bambu Studio slicing pipeline"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
# The geometry stack proven in cr-lab: trimesh meshes, manifold3d Booleans,
# shapely 2D profiles (extruded through mapbox-earcut).
dependencies = [
    "numpy>=1.26,<3",
    "trimesh>=4.11,<5",
    "manifold3d>=3.5,<4",
    "shapely>=2,<3",
    "mapbox-earcut>=2,<3",
    "scipy>=1.11,<2",
    "networkx>=3,<4",
    "pyyaml>=6,<7",
    "matplotlib>=3.8,<4",
    # STEP import for trimesh.load (OpenCASCADE); designs built from library STEPs.
    "cascadio>=0.1.1,<0.2",
]

[project.urls]
Repository = "https://github.com/TobiasEdman/printlab"

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "ruff>=0.7,<1",
]

[project.scripts]
printlab = "printlab.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/printlab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["bambu: needs the pinned Bambu Studio installed; skipped otherwise"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
