<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
  :root { --bg: #f6f7f9; --panel: #ffffff; --text: #1f2933; --muted: #5f6b7a; --accent: #2f6f9f; --border: #d9dee5; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
               font: 14px/1.4 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  #bar { position: absolute; top: 0; left: 0; right: 0; display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
         padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--border); z-index: 2; }
  #bar h1 { font-size: 15px; margin: 0 12px 0 0; }
  button { font: inherit; padding: 5px 12px; border: 1px solid var(--border); border-radius: 6px; background: #fff;
           color: var(--text); cursor: pointer; }
  button.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  #legend { position: absolute; left: 16px; bottom: 16px; background: var(--panel); border: 1px solid var(--border);
            border-radius: 8px; padding: 8px 12px; z-index: 2; }
  #legend label { display: flex; gap: 8px; align-items: center; margin: 2px 0; cursor: pointer; }
  #legend .sw { width: 14px; height: 14px; border-radius: 3px; display: inline-block; }
  #hint { position: absolute; right: 16px; bottom: 16px; color: var(--muted); font-size: 12px; z-index: 2; }
  canvas { display: block; }
</style>
</head>
<body>
<div id="bar"><h1>__TITLE__</h1><span id="tabs"></span></div>
<div id="legend"></div>
<div id="hint">drag: rotate · scroll: zoom · right-drag: pan</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/STLLoader.js"></script>
<script>
const SCENES = __SCENES__;
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(window.devicePixelRatio);
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xf6f7f9);
const camera = new THREE.PerspectiveCamera(40, 1, 1, 20000);
const controls = new THREE.OrbitControls(camera, renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff, 0x9aa4ae, 0.85));
const sun = new THREE.DirectionalLight(0xffffff, 0.75); sun.position.set(400, 800, 300); scene.add(sun);
const under = new THREE.DirectionalLight(0xffffff, 0.5); under.position.set(-300, -800, -200); scene.add(under);  // undersides (back-face text)
const loader = new THREE.STLLoader();
let group = null;

function decode(b64) {
  const s = atob(b64), buf = new Uint8Array(s.length);
  for (let i = 0; i < s.length; i++) buf[i] = s.charCodeAt(i);
  return buf.buffer;
}

function show(k) {
  if (group) scene.remove(group);
  group = new THREE.Group();
  group.rotation.x = -Math.PI / 2;                       // models are z-up
  const legend = document.getElementById("legend");
  legend.innerHTML = "";
  for (const p of SCENES[k].parts) {
    let geom;
    if (p.stl) { geom = loader.parse(decode(p.stl)); geom.computeVertexNormals(); }
    else if (p.sphere) {
      const [r, cx, cy, cz, t0, t1] = p.sphere;
      geom = new THREE.SphereGeometry(r, 96, 64, 0, 2 * Math.PI, t0, t1 - t0);
      geom.rotateX(Math.PI / 2); geom.translate(cx, cy, cz);
    }
    const mesh = new THREE.Mesh(geom, new THREE.MeshStandardMaterial({
      color: p.color, metalness: p.metal ? 0.6 : 0.05, roughness: p.metal ? 0.35 : 0.7, side: THREE.DoubleSide }));
    group.add(mesh);
    const row = document.createElement("label");
    row.innerHTML = `<input type="checkbox" checked><span class="sw" style="background:${p.color}"></span>${p.name}`;
    row.querySelector("input").onchange = e => { mesh.visible = e.target.checked; };
    legend.appendChild(row);
  }
  scene.add(group);
  const box = new THREE.Box3().setFromObject(group), c = box.getCenter(new THREE.Vector3());
  const size = box.getSize(new THREE.Vector3()).length();
  controls.target.copy(c);
  camera.position.set(c.x + size * 0.7, c.y + size * 0.45, c.z + size * 0.8);
  camera.near = size / 100; camera.far = size * 20; camera.updateProjectionMatrix();
  document.querySelectorAll("#tabs button").forEach((b, i) => b.classList.toggle("on", i === k));
}

SCENES.forEach((s, i) => {
  const b = document.createElement("button"); b.textContent = s.title; b.onclick = () => show(i);
  document.getElementById("tabs").appendChild(b);
});
function resize() {
  renderer.setSize(window.innerWidth, window.innerHeight);
  camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();
}
window.addEventListener("resize", resize); resize(); show(0);
(function loop() { requestAnimationFrame(loop); controls.update(); renderer.render(scene, camera); })();
</script>
</body>
</html>
